name: Build PhoenixLedger C# Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows x64 build and publish
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj

      - name: Build Windows Forms application
        run: dotnet build PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj --no-restore --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: >-
          dotnet publish PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output dist/win-x64

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLedger-CSharpLab-v0.1.0-win-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 30
