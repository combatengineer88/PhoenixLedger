name: Build and release PhoenixLedger C# Lab installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Build Windows x64 application and installer
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj -getProperty:Version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected app version: $version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj

      - name: Compile the Windows Forms application
        run: dotnet build PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj --no-restore --configuration Release

      - name: Publish self-contained Windows x64 application
        shell: pwsh
        run: |
          dotnet publish PhoenixLedger.CSharpLab/PhoenixLedger.CSharpLab.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output dist/win-x64
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed." }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Compile installable Windows setup executable
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DAppVersion=$env:APP_VERSION" "Installer\PhoenixLedger.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          if (!(Test-Path "dist\setup\PhoenixLedger-CSharpLab-Setup.exe")) {
            throw "Installer executable was not produced."
          }

      - name: Upload installable Windows setup
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLedger-CSharpLab-Windows-Installer
          path: dist/setup/PhoenixLedger-CSharpLab-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixLedger-CSharpLab-Portable-win-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release for in-app updates
    needs: windows-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the installer artifact
        uses: actions/download-artifact@v4
        with:
          name: PhoenixLedger-CSharpLab-Windows-Installer
          path: release

      - name: Create release for each new app version
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.windows-build.outputs.app_version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; not replacing its installer."
          else
            gh release create "$tag" release/PhoenixLedger-CSharpLab-Setup.exe \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PhoenixLedger C# Lab $tag" --generate-notes
            echo "Published release $tag for automatic in-app updates."
          fi
